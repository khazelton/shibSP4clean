# Apache config for the SP v4 PoC agent. Replaces the RPM's shib4.conf
# (kept as shib4.conf.shipped in the image for reference).

<IfModule !mod_shib>
LoadModule shib_module /usr/lib64/shibboleth-sp/mod_shib4.so
</IfModule>

# Shipped default. With this Off, use "Require shib-session", not "valid-user".
ShibCompatValidUser Off

# Redirect plain HTTP to HTTPS
<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/localhost.crt
    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key

    # Agent handlers (/Shibboleth.sso/*) are served by mod_shib4 itself.
    <Location /Shibboleth.sso>
        AuthType None
        Require all granted
    </Location>

    # Strip any identity headers a client might try to inject before the proxy hop.
    RequestHeader unset X-Shib-Sub
    RequestHeader unset X-Shib-Mail
    RequestHeader unset X-Shib-DisplayName
    RequestHeader unset X-Shib-GivenName
    RequestHeader unset X-Shib-Sn
    RequestHeader unset X-Shib-Session-Id
    RequestHeader unset X-Shib-Application-Id
    RequestHeader unset X-Remote-User

    # Protected app: active session required, then proxied to Jetty.
    <Location /secure>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require shib-session

        # Env vars (agent default export) -> headers for the proxy hop.
        # Attribute IDs observed at /Shibboleth.sso/Session with Google on 2026-11-01:
        # sub, displayName, givenName, sn, picture. (mail expected but absent - investigating.)
        RequestHeader set X-Shib-Sub            "%{sub}e"                  env=sub
        RequestHeader set X-Shib-Mail           "%{mail}e"                 env=mail
        RequestHeader set X-Shib-DisplayName    "%{displayName}e"          env=displayName
        RequestHeader set X-Shib-GivenName      "%{givenName}e"            env=givenName
        RequestHeader set X-Shib-Sn             "%{sn}e"                   env=sn
        RequestHeader set X-Shib-Session-Id     "%{Shib-Session-ID}e"      env=Shib-Session-ID
        RequestHeader set X-Shib-Application-Id "%{Shib-Application-ID}e"  env=Shib-Application-ID
        RequestHeader set X-Remote-User         "%{REMOTE_USER}s"
    </Location>
    ProxyPreserveHost On
    ProxyPass        /secure http://app:8081/secure
    ProxyPassReverse /secure http://app:8081/secure

    # Public landing page, no session required.
    <Location /public>
        AuthType shibboleth
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>
    ProxyPass        /public http://app:8081/public
    ProxyPassReverse /public http://app:8081/public

    DocumentRoot /var/www/html
</VirtualHost>
